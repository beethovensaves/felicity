name: Validate packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check source and manifest
        run: python3 scripts/check_package.py
      - name: Check eval case catalog
        run: python3 scripts/run_evals.py --list
      - name: Build install packages
        run: python3 scripts/build_packages.py
      - name: Test ZIP archives
        run: |
          unzip -t dist/felicity-codex.zip
          unzip -t dist/felicity-claude-code.zip
